[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmri-fnirs-transfer"
version = "0.1.0"
description = "fMRI-teacher → fNIRS-student Transfer Learning for Brain Signal Decoding"
authors = [
    {name = "Eyyub Guven", email = "eyyub.gvn@gmail.com"},
]
readme = "README_TRANSFER.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["fNIRS", "fMRI", "transfer-learning", "brain-computer-interface", "pytorch-lightning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch==2.2.0",
    "lightning==2.2",
    "hydra-core==1.3",
    "wandb",
    "osfclient",
    "pytest",
    "pre-commit",
    "black",
    "isort",
    "scikit-learn>=1.3.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "omegaconf>=2.3.0",
    "einops>=0.6.0",
    "scipy>=1.9.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "black",
    "isort",
    "flake8",
]
gpu = [
    "torch==2.2.0+cu118",
]

[project.urls]
Homepage = "https://github.com/curiousbrutus/fNIRS-Vise"
Repository = "https://github.com/curiousbrutus/fNIRS-Vise"
Documentation = "https://github.com/curiousbrutus/fNIRS-Vise/blob/main/README_TRANSFER.md"
Issues = "https://github.com/curiousbrutus/fNIRS-Vise/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
