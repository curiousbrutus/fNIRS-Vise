# @package _global_
# Hydra sweep configuration for fMRI-fNIRS transfer learning
# Optimized hyperparameter search across transfer modes and distillation parameters

defaults:
  - base
  - _self_

# Hydra sweep configuration
hydra:
  mode: MULTIRUN
  sweep:
    dir: sweep_outputs
    subdir: ${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: fmri_fnirs_sweep
    chdir: true
    
# Experiment tracking
experiment:
  name: fmri_fnirs_sweep
  project: fmri-fnirs-codespace
  tags:
    - sweep
    - transfer_learning
    - multirun

# Override base config for sweep-specific settings
training:
  max_epochs: 50  # Reduced for sweep efficiency
  
# Memory optimization for parallel jobs
memory:
  gradient_checkpointing: true
  clear_cache_interval: 5
  
# Logging configuration
trainer:
  logger:
    class_path: pytorch_lightning.loggers.WandbLogger
    init_args:
      project: ${experiment.project}
      name: "${experiment.name}_${model.backbone}_${transfer.mode}"
      tags: ${experiment.tags}
      save_dir: ./sweep_logs
      offline: false
