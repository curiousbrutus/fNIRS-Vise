model:
  backbone: custom
  fnirs_channels: 52
  fnirs_time: 200
  fmri_features: 768
  num_classes: 4
  hidden_dim: 256
  dropout: 0.3
  attention:
    dim: 256
    heads: 8
    dropout: 0.1
transfer:
  mode: feature_guided
  freeze_fmri: true
  distill_alpha: 0.5
  distill_temperature: 4.0
training:
  batch_size: 16
  max_epochs: 1
  learning_rate: 0.001
  weight_decay: 1.0e-05
  warmup_steps: 1000
data:
  cv_method: loso
  test_size: 0.2
  random_state: 42
trainer:
  accelerator: auto
  devices: auto
  precision: 32
  fast_dev_run: true
  callbacks:
    early_stopping:
      monitor: val_loss
      patience: 20
      mode: min
    model_checkpoint:
      monitor: val_accuracy
      mode: max
      save_top_k: 5
  logger: null
seed: 42
experiment:
  name: fmri_fnirs_sweep
  project: fmri-fnirs-codespace
  tags:
  - sweep
  - transfer_learning
  - multirun
memory:
  gradient_checkpointing: true
  clear_cache_interval: 5
